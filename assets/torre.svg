<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Ícone do atalho: a Torre a escalar, no âmbar do projeto -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c14f"/>
      <stop offset="0.55" stop-color="#f2a41c"/>
      <stop offset="1" stop-color="#e08f0e"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>

  <!-- névoa do topo: o losango branco da marca, ainda fora de alcance -->
  <g transform="rotate(45 128 56)">
    <rect x="106" y="34" width="44" height="44" rx="7" fill="#ffffff"/>
    <rect x="121" y="49" width="14" height="14" rx="2" fill="#f2a41c"/>
  </g>

  <!-- a Torre: sobe afinando, andares vazados no âmbar -->
  <path d="M78 214 L98 96 L158 96 L178 214 Z" fill="#2b2b2b"/>
  <rect x="70" y="208" width="116" height="14" rx="7" fill="#2b2b2b"/>
  <g stroke="#f2a41c" stroke-width="7" stroke-linecap="round">
    <line x1="97" y1="182" x2="159" y2="182"/>
    <line x1="101" y1="154" x2="155" y2="154"/>
    <line x1="105" y1="126" x2="151" y2="126"/>
  </g>
  <!-- porta -->
  <path d="M120 208 L120 196 Q128 188 136 196 L136 208 Z" fill="#f7c14f"/>
</svg>
