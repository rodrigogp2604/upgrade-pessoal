services:
  app:
    build: .
    image: upgrade-pessoal
    container_name: upgrade-pessoal
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      # IP da máquina na rede local, descoberto por scripts/start.ps1. Sem isso o
      # servidor só conhece o IP interno do Docker e o QR de pareamento sai inútil.
      - HOST_LAN_IP=${HOST_LAN_IP:-}
      - DATABASE_URL=file:/app/data/upgrade.db
      - UPLOAD_DIR=/app/data/uploads
      - PORT=4000
    volumes:
      # persiste banco e provas na máquina — backup = copiar a pasta ./data
      - ./data:/app/data
    restart: unless-stopped
